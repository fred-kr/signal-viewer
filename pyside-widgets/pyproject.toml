[project]
name = "pyside-widgets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devduck", email = "frederik.kraemer@dev-duck.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "darkdetect>=0.8.0",
    "numpy>=2.4.4",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.0",
    "qtconsole>=5.7.2",
]

[project.scripts]
designer = "pyside_widgets.examples.run_qt_designer:run_qt_designer"

[tool.uv.sources]
pyqtgraph = { git = "https://github.com/pyqtgraph/pyqtgraph", rev = "master" }

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"


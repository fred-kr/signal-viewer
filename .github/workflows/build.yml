name: Build binaries

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Build against the interpreter from actions/setup-python (shared libpython, known to work with PyInstaller)
  # instead of letting uv download its own.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            exe: dist/SignalViewer/SignalViewer.exe
          - os: macos-15
            label: macos-arm64
            exe: dist/SignalViewer.app/Contents/MacOS/SignalViewer
          - os: macos-15-intel
            label: macos-x86_64
            exe: dist/SignalViewer.app/Contents/MacOS/SignalViewer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=SignalViewer-$VERSION-${{ matrix.label }}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller packaging/signal_viewer.spec --noconfirm --clean

      - name: Smoke test (import everything, build the GUI off-screen, exit)
        shell: bash
        run: |
          "${{ matrix.exe }}" --version
          "${{ matrix.exe }}" --self-test

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SignalViewer -DestinationPath "${{ steps.version.outputs.archive }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps symlinks and the bundle layout intact; plain zip does not.
        run: ditto -c -k --keepParent dist/SignalViewer.app "${{ steps.version.outputs.archive }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.archive }}
          path: ${{ steps.version.outputs.archive }}.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

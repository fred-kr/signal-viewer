[project]
name = "signal-viewer"
version = "0.4.1"
description = "A GUI for working with (biological) signal data."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "devduck", email = "frederik.kraemer@dev-duck.dev" }
]
dependencies = [
    "attrs>=26.1.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "numexpr>=2.14.2",
    "numpy>=2.5.4",
    "polars[excel]>=2.0.0",
    "pyarrow>=26.0.0",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "pyside6>=6.12.0",
    "pywavelets>=1.10.0",
    "scipy>=1.18.1",
    "tables>=3.11.1",
    "wfdb>=4.3.1",
    "scikit-learn>=1.9.1",
    "neurokit2>=0.2.13",
    "pyqtgraph",
    "pyside-widgets",
    "pyside-config",
    "pyside6-essentials>=6.12.0",
    "ts2vg>=1.2.4",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.9",
    "pyrefly>=1.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "qtconsole>=5.7.2",  # Jupyter console in the View menu when DEV=1 (pyside-widgets no longer requires it)
    "scipy-stubs>=1.18.1.1",

]

[project.scripts]
signal-viewer = "signal_viewer.start:gui"
sv = "signal_viewer.start:gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pyside-config = { git = "https://github.com/fred-kr/pyside-config", branch = "main" }
pyside-widgets = { git = "https://github.com/fred-kr/pyside-widgets", branch = "main" }
pyqtgraph = { git = "https://github.com/pyqtgraph/pyqtgraph", rev = "master" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
fix = true
extend-exclude = [
    "generated"
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

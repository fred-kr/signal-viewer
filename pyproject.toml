[project]
name = "signal-viewer"
version = "0.2.0"
description = "A GUI for working with (biological) signal data."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "devduck", email = "frederik.kraemer@dev-duck.dev" }
]
dependencies = [
    "attrs>=26.1.0",
    "loguru>=0.7.3",
    "mne>=1.12.1",
    "numexpr>=2.14.2",
    "numpy>=2.5.1",
    "polars[excel]>=1.43.2",
    "pyarrow>=25.0.0",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "pyside6>=6.11.1",
    "pywavelets>=1.9.0",
    "scipy>=1.18.0",
    "tables>=3.11.1",
    "wfdb>=4.3.1",
    "scikit-learn>=1.9.0",
    "neurokit2>=0.2.13",
    "pyqtgraph",
    "pyside-widgets",
    "pyside-config",
    "ts2vg>=1.2.4",
    "pyside6-essentials>=6.11.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pyinstaller-hooks-contrib>=2026.6",
    "pyright>=1.1.411",
]

[project.scripts]
signal-viewer = "signal_viewer.start:gui"
sv = "signal_viewer.start:gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pyside-config = { git = "https://github.com/fred-kr/pyside-config", branch = "main" }
pyside-widgets = { git = "https://github.com/fred-kr/pyside-widgets", branch = "main" }
pyqtgraph = { git = "https://github.com/pyqtgraph/pyqtgraph", rev = "master" }

[tool.ruff]
line-length = 120
fix = true
extend-exclude = [
    "generated"
]